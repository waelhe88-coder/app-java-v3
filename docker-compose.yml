services:
  postgres:
    image: postgres:18-alpine
    container_name: marketplace-db
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 moved the cluster to /var/lib/postgresql/18/docker and
      # declares /var/lib/postgresql as its volume (CodeRabbit #241): mounting
      # at the old PG<=17 path /var/lib/postgresql/data persisted NOTHING.
      # The named volume now covers the versioned data root.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: marketplace-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata18:
