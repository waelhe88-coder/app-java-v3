# This workflow builds a package using Maven and then publishes it to GitHub
# Packages when a release is created.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path
#
# Framework-managed release pipeline (reworked 2026-09-05 — the original
# template had never run: zero releases existed, and two defects would have
# failed the first run):
#   1. The root pom carries no distributionManagement — `mvn deploy` had
#      nowhere to publish. Added to the root pom (id "github" matches the
#      server-id below; setup-java writes the authenticated server entry
#      into settings.xml).
#   2. The reactor version is 0.1.0-SNAPSHOT — a release publishes the TAG's
#      version, so versions-maven-plugin sets every module version from the
#      release tag name (v0.1.0 -> 0.1.0) via -DprocessAllModules. The poms
#      on main stay 0.1.0-SNAPSHOT (development flow unchanged).
# `deploy -DskipTests` publishes exactly what CI already verified: the tag
# points at a main commit whose required checks (Build & Test + Full
# Integration Test) ran the full suite. Checkout uses fetch-depth: 0 because
# marketplace-app binds git-commit-id at build time.
name: Maven Package

on:
  release:
    types: [ created ]

permissions:
  contents: read
  packages: write
  # Read access to check-runs for the release gate below (CWE-345, CodeRabbit
  # #241): the tag's CI evidence is queried before anything is published.
  checks: read

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git-commit-id)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Derive release version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Release gate (CWE-345, CodeRabbit #241): publishing ran with
      # -DskipTests on the assumption that "the tag points at a main commit
      # whose required checks ran the full suite" — an assumption only held
      # by comments, not by anything executable. This step makes the
      # requirement a check: the tagged commit must be part of main history
      # AND every check that ran on it must be green. A tag on an unverified
      # commit now fails the workflow before `deploy`.
      - name: Gate on green CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="${{ github.sha }}"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit" FETCH_HEAD; then
            echo "::error::release tag ${GITHUB_REF_NAME} points at $commit, which is NOT part of main history — refusing to publish an unverified commit" >&2
            exit 1
          fi
          # No check may still be RUNNING (CodeRabbit #242 round 2: a queued or
          # in_progress check must block the gate even when another check
          # already succeeded — publishing must wait for the full check set).
          pending=$(gh api --paginate "repos/${{ github.repository }}/commits/$commit/check-runs" \
            --jq '[.check_runs[] | select(.status != "completed")] | length')
          if [ "${pending:-0}" -ne 0 ]; then
            echo "::error::tagged commit $commit still has $pending check-run(s) not completed — refusing to publish before CI finishes" >&2
            exit 1
          fi
          failing=$(gh api --paginate "repos/${{ github.repository }}/commits/$commit/check-runs" \
            --jq '[.check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure") | .name] | join(", ")')
          if [ -n "$failing" ]; then
            echo "::error::tagged commit $commit has non-green checks: $failing" >&2
            exit 1
          fi
          successes=$(gh api --paginate "repos/${{ github.repository }}/commits/$commit/check-runs" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "${successes:-0}" -eq 0 ]; then
            echo "::error::tagged commit $commit has NO successful CI check-runs — refusing to publish without CI evidence" >&2
            exit 1
          fi
          echo "Release gate passed: $commit is on main with $successes green check(s)."

      - name: Set reactor version from tag (strip -SNAPSHOT, all modules)
        run: >-
          ./mvnw --batch-mode org.codehaus.mojo:versions-maven-plugin:2.21.0:set
          -DnewVersion="$RELEASE_VERSION" -DprocessAllModules
          -DgenerateBackupPoms=false

      - name: Build and publish
        run: ./mvnw --batch-mode -DskipTests deploy -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_TOKEN: ${{ github.token }}
